apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cafeflow-backend
  labels:
    dev-tutorial: cloud-run-ai-challenge
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/cafeflow-backend:latest
          resources:
            limits:
              memory: 512Mi
              cpu: 1000m
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
